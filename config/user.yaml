spring:
  application:
    name: "${SPRING_APPLICATION_NAME:user}"
  datasource:
    driver-class-name: "org.postgresql.Driver"
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    hikari:
      maximum-pool-size: "${HIKARI_MAXIMUM_POOL_SIZE:9}"
      connection-timeout: 60000
      initialization-fail-timeout: 60000
      minimum-idle: 3
      connection-test-query: "SELECT 1"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: "${JPA_HIBERNATE_DDL_AUTO:validate}"
    show-sql: false
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.PostgreSQLDialect"
        jdbc:
          time_zone: UTC
        format_sql: true
  liquibase:
    change-log: "classpath:db/changelog/master.xml"
    clear-checksums: true
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:replace-me}
            client-secret: ${GOOGLE_CLIENT_SECRET:replace-me}
            scope:
              - openid
              - profile
              - email
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
        provider:
          google:
            issuer-uri: https://accounts.google.com

server:
  port: "${SERVER_PORT:8084}"
  forward-headers-strategy: framework

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://ph-discovery-server:8761/eureka/}"
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

app:
  jwt:
    issuer: ${APP_SECURITY_ISSUER:http://localhost:8084}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P14D}
  login:
    redirect:
      patient-url: ${APP_LOGIN_REDIRECT_PATIENT_URL:http://localhost:3000/patients/dashboard}
      pharmacist-url: ${APP_LOGIN_REDIRECT_PHARMACIST_URL:http://localhost:3000/pharmacist/dashboard}
      backoffice-url: ${APP_LOGIN_REDIRECT_BACKOFFICE_URL:http://localhost:3000/backoffice/dashboard}
      default-url: ${APP_LOGIN_REDIRECT_DEFAULT_URL:http://localhost:3000/login}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  zipkin:
    tracing:
      endpoint: "${ZIPKIN_ENDPOINT}"
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    org.springframework.security: INFO
    com.ph.user: INFO